name: Test and publish recovery

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recovery-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
      - run: pip install --require-hashes --requirement requirements-dev.lock
      - run: python -m pytest
      - name: Build the image that will be published
        run: |
          docker build \
            --build-arg VCS_REF="$GITHUB_SHA" \
            --build-arg VERSION="$(cat VERSION)" \
            --tag mobius-recovery:verified .
      - name: Verify immutable and non-root boundary
        run: scripts/verify-image.sh mobius-recovery:verified "$GITHUB_SHA"
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable image and stable main
        if: github.event_name != 'pull_request'
        run: |
          image="ghcr.io/mobius-os/mobius-recovery"
          immutable="sha-$GITHUB_SHA"
          docker tag mobius-recovery:verified "$image:$immutable"
          docker push "$image:$immutable"
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            docker tag mobius-recovery:verified "$image:stable"
            docker push "$image:stable"
          fi

name: Test and publish recovery

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recovery-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
      - run: pip install --require-hashes --requirement requirements-dev.lock
      - run: python -m pytest
      - name: Build the image that will be published
        run: |
          docker build \
            --build-arg VCS_REF="$GITHUB_SHA" \
            --build-arg VERSION="$(cat VERSION)" \
            --tag mobius-recovery:verified .
      - name: Verify immutable and non-root boundary
        run: scripts/verify-image.sh mobius-recovery:verified "$GITHUB_SHA"
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable image and stable main
        if: github.event_name != 'pull_request'
        run: |
          image="ghcr.io/mobius-os/mobius-recovery"
          immutable="sha-$GITHUB_SHA"
          docker tag mobius-recovery:verified "$image:$immutable"
          docker push "$image:$immutable"
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            docker tag mobius-recovery:verified "$image:stable"
            docker push "$image:stable"
          fi
